services:
  - type: web
    name: apex-lap-lab
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python api_server.py
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: HOST
        value: 0.0.0.0
